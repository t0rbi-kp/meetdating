<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Access Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-blur-container {
            background-image: url('https://i.ibb.co/pBP6WHbp/85193424-042-2027.jpg');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans">

    <div class="absolute inset-0 bg-blur-container filter blur-[2px] brightness-75 scale-105 pointer-events-none z-0"></div>

    <div class="w-full max-w-sm bg-gray-900/90 backdrop-blur-md border border-gray-800/80 rounded-3xl p-6 shadow-2xl relative z-10 flex flex-col space-y-6">
        
        <div class="text-center space-y-1">
            <h1 class="text-xl font-bold text-white tracking-tight">Member Portal</h1>
            <p class="text-xs text-gray-400">Complete quick verification to view matches</p>
        </div>

        <div id="step-1" class="space-y-4">
            <p class="text-sm font-medium text-gray-200 text-center">Are you 18 years of age or older?</p>
            <div class="space-y-2">
                <button onclick="goToStep(2)" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3 px-4 rounded-xl transition-all text-sm shadow-md active:scale-[0.98]">
                    Yes, I am 18+
                </button>
                <button onclick="handleUnderage()" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium py-3 px-4 rounded-xl border border-gray-700 transition-all text-sm active:scale-[0.98]">
                    No, under 18
                </button>
            </div>
        </div>

        <div id="step-2" class="space-y-4 hidden">
            <p class="text-sm font-medium text-gray-200 text-center">What type of connection are you seeking?</p>
            <div class="space-y-2">
                <button onclick="finishSurvey()" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3 px-4 rounded-xl transition-all text-sm shadow-md active:scale-[0.98]">
                    Casual Dating
                </button>
                <button onclick="finishSurvey()" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold py-3 px-4 rounded-xl border border-gray-700 transition-all text-sm active:scale-[0.98]">
                    Serious Relationship
                </button>
            </div>
        </div>

        <div id="step-3" class="space-y-4 text-center hidden">
            <div class="space-y-1">
                <h2 class="text-lg font-bold text-emerald-400">Profiles Ready</h2>
                <p class="text-xs text-gray-300">Matching criteria applied successfully.</p>
            </div>
            
            <a href="https://mh6jk.bemobtrcks.com/click" class="block w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-95 text-white font-bold py-3.5 px-4 rounded-xl transition-all text-sm uppercase tracking-wider shadow-lg active:scale-[0.98]">
                View Matches Now
            </a>
        </div>

        <div id="step-denied" class="space-y-2 text-center hidden">
            <h2 class="text-base font-bold text-red-400">Access Restricted</h2>
            <p class="text-xs text-gray-400">You must be at least 18 years old to proceed.</p>
        </div>

    </div>

    <script>
        function goToStep(stepNumber) {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.add('hidden');
            document.getElementById('step-denied').classList.add('hidden');

            const target = document.getElementById(`step-${stepNumber}`);
            if (target) {
                target.classList.remove('hidden');
            }
        }

        function finishSurvey() {
            goToStep(3);
        }

        function handleUnderage() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-denied').classList.remove('hidden');
        }
    </script>

</body>
</html>
